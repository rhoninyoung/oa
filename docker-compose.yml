version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oa_mvp_postgres
    environment:
      POSTGRES_DB: oa_mvp
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oa -d oa_mvp']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
