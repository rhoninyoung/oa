<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OA 项目管理 MVP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部栏 -->
  <header id="app-header">
    <span class="app-title">OA 项目管理 MVP</span>
    <div class="header-actions">
      <button id="btn-export" title="导出 JSON 备份">导出</button>
      <button id="btn-import" title="从 JSON 恢复">导入</button>
      <button id="btn-export-excel" title="导出 Excel">导出Excel</button>
      <button id="btn-import-excel" title="从 Excel 导入">导入Excel</button>
      <button id="btn-stats" title="统计看板">统计看板</button>
      <input type="file" id="file-import" accept=".json" style="display:none" />
      <input type="file" id="file-import-excel" accept=".xlsx,.xls" style="display:none" />
    </div>
  </header>

  <!-- 三栏主体 -->
  <div id="app-body">

    <!-- 左栏：项目/迭代树 -->
    <aside id="sidebar">
      <div id="role-switcher"></div>
      <div id="project-tree"></div>
    </aside>

    <!-- 中栏：WBS 表格 -->
    <main id="main-content">
      <!-- View mode tabs -->
      <div id="view-tabs" style="display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border);">
        <button id="tab-wbs" class="view-tab active">WBS视图</button>
        <button id="tab-dashboard" class="view-tab">首页</button>
        <button id="tab-calendar" class="view-tab">日历视图</button>
        <button id="tab-gantt" class="view-tab">甘特图</button>
        <button id="tab-kanban" class="view-tab">看板</button>
      </div>
      <div id="schedule-header"></div>
      <div id="approval-panel"></div>
      <!-- Group view: WBS table (always keeps wbs-tbody stable) -->
      <div id="group-view-wrapper">
        <table id="wbs-table">
          <thead id="wbs-thead"></thead>
          <tbody id="wbs-tbody"></tbody>
        </table>
      </div>
      <!-- Dashboard view -->
      <div id="dashboard-view-wrapper" class="hidden"></div>
      <!-- Master view: separate container, never touches wbs-table -->
      <div id="master-view-wrapper" class="hidden"></div>
      <!-- Calendar view -->
      <div id="calendar-view-wrapper" class="hidden"></div>
      <!-- Gantt view -->
      <div id="gantt-view-wrapper" class="hidden"></div>
      <!-- Kanban view -->
      <div id="kanban-view-wrapper" class="hidden"></div>
      <!-- Statistics dashboard view -->
      <div id="stats-view-wrapper" class="hidden">
        <div id="stats-header">
          <h2>统计看板</h2>
          <select id="stats-iteration-select"></select>
        </div>
        <div id="stats-content">
          <div class="stats-row">
            <div class="stats-card">
              <h3>各组工作量</h3>
              <canvas id="chart-workload" width="400" height="250"></canvas>
            </div>
            <div class="stats-card">
              <h3>各组工期合计（天）</h3>
              <canvas id="chart-days" width="400" height="250"></canvas>
            </div>
          </div>
          <div class="stats-row">
            <div class="stats-card full-width">
              <h3>各迭代审批状态</h3>
              <canvas id="chart-progress" width="800" height="250"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右栏：活动日志 -->
    <aside id="activity-log-panel">
      <h3>活动日志</h3>
      <ul id="activity-log-list"></ul>
    </aside>

  </div>

  <!-- Toast 通知 -->
  <div id="toast-container"></div>

  <!-- SheetJS for Excel import/export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js for statistics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
