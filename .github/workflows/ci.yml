name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  dt:
    name: DT (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa-mvp/shared test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shared
          path: packages/shared/coverage/

  ft:
    name: FT (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oa_mvp_test
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @oa-mvp/shared build
      - name: Type-check backend with tsconfig.spec.json
        run: cd packages/backend && npx tsc --noEmit -p tsconfig.spec.json
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://oa:oa_dev@localhost:5432/oa_mvp_test?schema=public
      - run: pnpm --filter @oa-mvp/backend test
        env:
          DATABASE_URL: postgresql://oa:oa_dev@localhost:5432/oa_mvp_test?schema=public

  frontend:
    name: FT (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oa-mvp/frontend test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oa_mvp_test
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: |
          docker-compose up -d
          npx prisma migrate deploy
          npx prisma db seed
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://oa:oa_dev@localhost:5432/oa_mvp_test?schema=public
      - run: pnpm --filter @oa-mvp/frontend build
      - run: pnpm --filter e2e test
        env:
          DATABASE_URL: postgresql://oa:oa_dev@localhost:5432/oa_mvp_test?schema=public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
